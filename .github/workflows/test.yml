name: Tests

on:
  push:
    branches:
      - test-github_action

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build GitManager.slnx --configuration Release

      - name: Run tests
        run: dotnet test GitManager.slnx --configuration Release --no-build
